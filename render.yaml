# Render Blueprint for Resource Scheduler
# https://render.com/docs/blueprint-spec
#
# Supports two database options:
# 1. PostgreSQL (recommended for production) - set DATABASE_URL
# 2. SQLite with persistent disk - set DATABASE_PATH

databases:
  - name: scheduler-db
    plan: free  # or starter, standard for production
    databaseName: scheduler
    user: scheduler

services:
  - type: web
    name: resource-scheduler
    runtime: node
    plan: free  # or starter, standard, etc.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: scheduler-db
          property: connectionString

